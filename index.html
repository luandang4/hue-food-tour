@media (prefers-color-scheme: dark){:root{--bg:#141311;--card:#1f1d1a;--ink:#f1ece4;--muted:#a59f95;--line:#34302a;--head:#2a2723;--accent:#e39aa6;--hr:#7fd09f;--cafe:#e0b583;--sight:#9db8e6;--opt:#e8cf6a}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}

h2{font-size:18px;margin:24px 0 2px}.area{color:var(--muted);font-size:13px;margin:0 0 8px}
.routes{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px}
.routes a{flex:1 1 140px;text-align:center;text-decoration:none;font-weight:600;font-size:13px;padding:9px 10px;border-radius:10px;background:var(--accent);color:var(--bg)}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
th,td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
th{background:var(--head);font-size:12px;color:var(--muted);font-weight:600}
tr:last-child td{border-bottom:0}
td.t{white-space:nowrap;font-weight:700;font-variant-numeric:tabular-nums;width:1%}
td.m{width:1%;text-align:center}
td.m a{display:inline-block;text-decoration:none;font-weight:700;font-size:12px;color:var(--accent);border:1px solid var(--accent);border-radius:8px;padding:5px 8px;white-space:nowrap}
.n{font-weight:700}.d{color:var(--muted);font-size:13px}
.k{font-size:11px;font-weight:700;margin-left:4px}
.k.hr{color:var(--hr)}.k.cafe{color:var(--cafe)}.k.sight{color:var(--sight)}.k.opt{color:var(--opt)}
tr.cafe td{background:color-mix(in srgb,var(--cafe) 7%,var(--card))}
tr.sight td{background:color-mix(in srgb,var(--sight) 7%,var(--card))}
tr.opt td.t,tr.opt .n{color:var(--opt)}
.alt{font-size:12px}.alt a{color:var(--accent)}
.legend{font-size:12px;color:var(--muted);margin-top:8px}
footer{color:var(--muted);font-size:12px;margin-top:20px}
</style>
</head>

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const a = (u, t) => `<a href="${esc(u)}" target="_blank" rel="noopener">${t}</a>`;
document.getElementById("app").innerHTML = Object.values(TOURS).map(t => `
  <h2>${esc(t.title)}</h2>
  <p class="area">${esc(t.area)} · ${esc(t.total)}</p>
  <div class="routes">${t.routes.map(r => a(r[1], "🧭 " + esc(r[0].replace("Chỉ đường: ", "")))).join("")}</div>
  <table>
    <thead><tr><th>Giờ</th><th>Điểm · Món</th><th>Map</th></tr></thead>
    <tbody>${t.stops.map(s => {
      const k = [];
      if (s.opt) k.push('<span class="k opt">TÙY CHỌN</span>');
      if (s.kind === "cafe") k.push('<span class="k cafe">☕</span>');
      if (s.kind === "sight" || s.sightToo) k.push('<span class="k sight">📍</span>');
      const d = [s.dish, s.info].filter(Boolean).join(" · ");
      return `<tr class="${s.kind}${s.opt ? " opt" : ""}">
        <td class="t">${esc(s.time)}</td>
        <td><span class="n">${esc(s.name)}</span>${k.join("")}
          ${d ? `<div class="d">${esc(d)}</div>` : ""}
          ${s.alt ? `<div class="alt">Thay thế: ${a(s.alt[1], esc(s.alt[0]))}</div>` : ""}</td>
        <td class="m">${a(s.map, "Maps")}</td></tr>`;
    }).join("")}</tbody>
  </table>`).join("");
</script>
